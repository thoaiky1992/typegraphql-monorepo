supergraph:
  listen: 0.0.0.0:3000
  path: /graphql
  introspection: true

homepage:
  enabled: false

sandbox:
  enabled: true

cors:
  allow_any_origin: true

include_subgraph_errors:
  all: true

health_check:
  listen: 0.0.0.0:3001
  enabled: true

headers:
  all:
    request:
      - propagate:
          matching: '.*'
